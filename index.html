<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Mily Obby Final</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; touch-action: none; }
        canvas { display: block; background: linear-gradient(#87CEEB, #E0F7FA); }
        
        /* BUTONLAR - EKRANIN EN ÜSTÜNDE */
        #controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 9999; }
        .move-btns { display: flex; gap: 15px; }
        .btn { 
            width: 80px; height: 80px; background: rgba(255,255,255,0.6); 
            border: 4px solid #fff; border-radius: 20px; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 30px; font-weight: bold; color: #333;
            user-select: none; -webkit-user-select: none;
        }
        #jump-btn { 
            background: #FF9800; color: white; width: 100px; height: 100px; border-radius: 50%; border: 5px solid #fff; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="controls">
        <div class="move-btns">
            <div class="btn" id="btnL">←</div>
            <div class="btn" id="btnR">→</div>
        </div>
        <div class="btn" id="jump-btn">UP</div>
    </div>

    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // OYUN AYARLARI
        let px = 50, py = 300, vy = 0, speed = 0;
        let gravity = 0.5;
        let jumpPower = -12;
        let isGrounded = false;

        // PLATFORMLAR (x, y, genişlik)
        const platforms = [
            {x: 0, y: 500, w: 200},
            {x: 250, y: 400, w: 150},
            {x: 500, y: 300, w: 150},
            {x: 750, y: 450, w: 150},
            {x: 1000, y: 350, w: 200}
        ];

        // KONTROLLER
        const keys = { L: false, R: false };

        // ZIPLAMA FONKSİYONU (DOĞRUDAN TETİKLENİR)
        function doJump() {
            if (isGrounded) {
                vy = jumpPower;
                isGrounded = false;
            }
        }

        // DOKUNMATİK OLAYLARI
        document.getElementById("btnL").ontouchstart = (e) => { e.preventDefault(); keys.L = true; };
        document.getElementById("btnL").ontouchend = () => keys.L = false;
        
        document.getElementById("btnR").ontouchstart = (e) => { e.preventDefault(); keys.R = true; };
        document.getElementById("btnR").ontouchend = () => keys.R = false;

        document.getElementById("jump-btn").ontouchstart = (e) => {
            e.preventDefault();
            doJump();
        };

        function update() {
            // Hareket
            if (keys.L) speed = -5;
            else if (keys.R) speed = 5;
            else speed = 0;

            px += speed;
            vy += gravity;
            py += vy;

            // Platform Çarpışması
            isGrounded = false;
            platforms.forEach(p => {
                if (px + 30 > p.x && px < p.x + p.w && py + 40 > p.y && py + 40 < p.y + 20 && vy >= 0) {
                    py = p.y - 40;
                    vy = 0;
                    isGrounded = true;
                }
            });

            // Düştüyse başa dön
            if (py > canvas.height) { px = 50; py = 300; vy = 0; }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Platformları Çiz
            ctx.fillStyle = "#4CAF50";
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, 20);
                ctx.strokeStyle = "#2E7D32";
                ctx.strokeRect(p.x, p.y, p.w, 20);
            });

            // Karakteri Çiz (Noob Renkleri)
            ctx.fillStyle = "#FFD500"; // Kafa
            ctx.fillRect(px + 5, py, 20, 20);
            ctx.fillStyle = "#0059B3"; // Gövde
            ctx.fillRect(px, py + 20, 30, 20);
        }

        update();
    </script>
</body>
</html>
