<!DOCTYPE html>
<html>
<head>
    <title>Mily Roblox Obby - Fix</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        
        /* SOLDAKİ JOYSTICK */
        #joystick-container { 
            position: absolute; bottom: 30px; left: 30px; 
            width: 90px; height: 90px; background: rgba(255,255,255,0.2); 
            border-radius: 50%; border: 2px solid white; z-index: 999; 
        }
        #joystick-knob { 
            position: absolute; top: 25px; left: 25px; 
            width: 40px; height: 40px; background: white; border-radius: 50%; 
        }

        /* SAĞDAKİ BÜYÜK ZIPLAMA BUTONU */
        #jump-btn { 
            position: absolute; bottom: 40px; right: 40px; 
            width: 80px; height: 80px; background: rgba(255,255,255,0.4); 
            border: 4px solid white; border-radius: 50%; 
            color: white; font-weight: bold; font-size: 18px;
            display: flex; justify-content: center; align-items: center; 
            z-index: 1000; /* En üst katman */
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: white; text-shadow: 1px 1px 2px black; z-index: 10; }
    </style>
</head>
<body>
    <div id="ui">Zıplama Butonu Eklendi! Parkuru Bitir.</div>
    <div id="joystick-container"><div id="joystick-knob"></div></div>
    
    <div id="jump-btn">JUMP</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
        scene.add(light);

        // --- PLATFORMLAR ---
        const platforms = [];
        function createBox(x, y, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshPhongMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            platforms.push(mesh);
        }

        createBox(0, 0, 0, 5, 1, 5, 0x3a9d23); 
        createBox(0, 1, -8, 3, 1, 3, 0xff0000); 
        createBox(4, 2, -15, 3, 1, 3, 0x0000ff); 
        createBox(-4, 3, -22, 3, 1, 3, 0xffff00); 
        createBox(0, 4, -30, 5, 1, 5, 0xff00ff); 

        // --- KARAKTER ---
        const player = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 0.5), new THREE.MeshPhongMaterial({ color: 0x0059b3 }));
        body.position.y = 1;
        player.add(body);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshPhongMaterial({ color: 0xffd500 }));
        head.position.y = 1.8;
        player.add(head);
        scene.add(player);

        let vy = 0, isGrounded = false, moveX = 0, moveZ = 0;

        // --- JOYSTICK ---
        const knob = document.getElementById('joystick-knob');
        window.addEventListener('touchstart', (e) => { if(e.target.id !== 'jump-btn') handleJoystick(e); });
        window.addEventListener('touchmove', (e) => { if(e.target.id !== 'jump-btn') handleJoystick(e); });
        window.addEventListener('touchend', () => { moveX = 0; moveZ = 0; knob.style.left = '25px'; knob.style.top = '25px'; });

        function handleJoystick(e) {
            const rect = document.getElementById('joystick-container').getBoundingClientRect();
            const t = e.touches[0];
            let x = t.clientX - rect.left - 45;
            let y = t.clientY - rect.top - 45;
            const d = Math.sqrt(x*x + y*y);
            if (d > 45) { x *= 45/d; y *= 45/d; }
            knob.style.left = (x + 25) + 'px'; knob.style.top = (y + 25) + 'px';
            moveX = x / 45; moveZ = y / 45;
        }

        // --- ZIPLAMA TUŞU AKTİFLEŞTİRME ---
        const jumpBtn = document.getElementById('jump-btn');
        const doJump = (e) => {
            if (isGrounded) {
                vy = 0.16;
                isGrounded = false;
            }
            e.preventDefault();
        };
        jumpBtn.addEventListener('touchstart', doJump);
        jumpBtn.addEventListener('mousedown', doJump);

        // --- DÖNGÜ ---
        function animate() {
            requestAnimationFrame(animate);

            vy -= 0.008; // Yerçekimi
            player.position.y += vy;
            player.position.x += moveX * 0.12;
            player.position.z += moveZ * 0.12;

            isGrounded = false;
            platforms.forEach(p => {
                if (Math.abs(player.position.x - p.position.x) < (p.geometry.parameters.width/2 + 0.4) &&
                    Math.abs(player.position.z - p.position.z) < (p.geometry.parameters.depth/2 + 0.4) &&
                    player.position.y > p.position.y && player.position.y < p.position.y + 1.2) {
                    player.position.y = p.position.y + 0.5;
                    vy = 0;
                    isGrounded = true;
                }
            });

            if (player.position.y < -15) { player.position.set(0, 5, 0); vy = 0; }
            if (Math.abs(moveX) > 0.1 || Math.abs(moveZ) > 0.1) player.rotation.y = Math.atan2(moveX, moveZ);

            camera.position.lerp(new THREE.Vector3(player.position.x, player.position.y + 6, player.position.z + 12), 0.1);
            camera.lookAt(player.position);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
