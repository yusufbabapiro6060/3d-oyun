<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Roblox Obby Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        
        /* KONTROL PANELİ */
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 1000; }
        .btn { width: 70px; height: 70px; background: rgba(255,255,255,0.4); border: 3px solid white; border-radius: 15px; color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; user-select: none; }
        #jump-btn { background: rgba(255,165,0,0.6); width: 90px; height: 90px; border-radius: 50%; font-size: 20px; }
        
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: white; text-shadow: 2px 2px #000; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">BUTONLARLA OYNA (Zıplama Turuncu Buton)</div>
    
    <div id="controls">
        <div style="display: flex; gap: 10px;">
            <div class="btn" id="left-btn">←</div>
            <div class="btn" id="forward-btn">↑</div>
            <div class="btn" id="right-btn">→</div>
        </div>
        <div class="btn" id="jump-btn">JUMP</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false }); // Performans için kapalı
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1));

        // Platformlar
        const platforms = [];
        function addBox(x,y,z,w,d,c) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w,1,d), new THREE.MeshBasicMaterial({color:c}));
            m.position.set(x,y,z); scene.add(m); platforms.push(m);
        }
        addBox(0,0,0,5,5,0x3a9d23); addBox(0,1.5,-8,3,3,0xff0000); addBox(4,3,-15,3,3,0x0000ff);

        // Karakter
        const player = new THREE.Mesh(new THREE.BoxGeometry(0.7,1.5,0.7), new THREE.MeshBasicMaterial({color:0xffff00}));
        player.position.y = 2; scene.add(player);

        let vy = 0, grounded = false, move = {f:0, l:0, r:0};

        // Kontroller
        const setBtn = (id, key, val) => {
            const b = document.getElementById(id);
            b.ontouchstart = (e) => { e.preventDefault(); if(key==='j'){ if(grounded){vy=0.18; grounded=false;} } else move[key]=val; };
            b.ontouchend = (e) => { e.preventDefault(); if(key!=='j') move[key]=0; };
        };
        setBtn('left-btn', 'l', 0.1); setBtn('right-btn', 'r', 0.1); setBtn('forward-btn', 'f', 0.1); setBtn('jump-btn', 'j', 0);

        function animate() {
            requestAnimationFrame(animate);
            vy -= 0.009; player.position.y += vy;
            player.position.z -= move.f; player.position.x -= move.l; player.position.x += move.r;

            grounded = false;
            platforms.forEach(p => {
                if(Math.abs(player.position.x-p.position.x)<p.geometry.parameters.width/2+0.3 && 
                   Math.abs(player.position.z-p.position.z)<p.geometry.parameters.depth/2+0.3 && 
                   player.position.y > p.position.y && player.position.y < p.position.y+1.2) {
                    player.position.y = p.position.y + 1; vy = 0; grounded = true;
                }
            });

            if(player.position.y < -10) { player.position.set(0,5,0); vy=0; }
            camera.position.set(player.position.x, player.position.y+5, player.position.z+10);
            camera.lookAt(player.position);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
