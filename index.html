<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihirli El Çizimi</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0; padding: 0;
            background-color: #0a0a0a;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; color: #00ff00;
        }

        #container {
            position: relative;
            width: 1280px; 
            height: 720px;  
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: black; 
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
        }

        /* Kamerayı tamamen gizliyoruz */
        #webcam {
            display: none;
        }

        #canvas {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            z-index: 10;
        }

        #status {
            margin-top: 15px; font-size: 16px;
            text-shadow: 0 0 5px #00ff00;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas" width="1280" height="720"></canvas>
    </div>

    <div id="status">Sistem Başlatılıyor... Lütfen Kameraya İzin Verin.</div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');

        let drawingColor = '#ff0055'; 
        let drawingLineWidth = 6;
        let isDrawing = false;
        let lastX = 0; let lastY = 0;

        let movableBox = {
            x: 590, y: 310, width: 100, height: 100,
            color: '#00e5ff', isDragging: false,
            dragStartX: 0, dragStartY: 0
        };

        // Arka planı en başta siyah yapalım
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Kutuyu ilk başta çizelim
        ctx.fillStyle = movableBox.color;
        ctx.fillRect(movableBox.x, movableBox.y, movableBox.width, movableBox.height);

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function drawScene(results) {
            // Siyah arka planı ve kutuyu her karede güncelle
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = movableBox.color;
            ctx.fillRect(movableBox.x, movableBox.y, movableBox.width, movableBox.height);
            
            if (movableBox.isDragging) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = movableBox.color;
                ctx.strokeStyle = 'white';
                ctx.strokeRect(movableBox.x, movableBox.y, movableBox.width, movableBox.height);
                ctx.shadowBlur = 0;
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                const wrist = landmarks[0];
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const middleTip = landmarks[12];
                const pinkyTip = landmarks[20];

                const thumbX = (1 - thumbTip.x) * canvas.width;
                const thumbY = thumbTip.y * canvas.height;
                const indexX = (1 - indexTip.x) * canvas.width;
                const indexY = indexTip.y * canvas.height;

                const pinchDistance = getDistance(thumbTip, indexTip);
                const isPinching = pinchDistance < 0.05;

                const isPalmOpen = getDistance(wrist, indexTip) > 0.4 && 
                                    getDistance(wrist, middleTip) > 0.4 &&
                                    getDistance(wrist, pinkyTip) > 0.4;

                if (isPalmOpen && !movableBox.isDragging) {
                    ctx.fillStyle = "black";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    statusText.innerText = "Ekran Temizlendi!";
                    return;
                }

                if (isPinching) {
                    if (!movableBox.isDragging) {
                        if (indexX > movableBox.x && indexX < movableBox.x + movableBox.width &&
                            indexY > movableBox.y && indexY < movableBox.y + movableBox.height) {
                            
                            movableBox.isDragging = true;
                            movableBox.dragStartX = indexX - movableBox.x;
                            movableBox.dragStartY = indexY - movableBox.y;
                            statusText.innerText = "Kutu Tutuldu!";
                        }
                    } else {
                        movableBox.x = indexX - movableBox.dragStartX;
                        movableBox.y = indexY - movableBox.dragStartY;
                    }
                    isDrawing = false; 

                } else {
                    if (movableBox.isDragging) {
                        movableBox.isDragging = false;
                        statusText.innerText = "Kutu Bırakıldı.";
                    }

                    if (!movableBox.isDragging && indexTip.y < landmarks[6].y) {
                        if (!isDrawing) {
                            isDrawing = true;
                            lastX = indexX; lastY = indexY;
                        } else {
                            ctx.beginPath();
                            ctx.strokeStyle = drawingColor;
                            ctx.lineWidth = drawingLineWidth;
                            ctx.lineCap = 'round';
                            ctx.moveTo(lastX, lastY);
                            ctx.lineTo(indexX, indexY);
                            ctx.stroke();
                            
                            lastX = indexX; lastY = indexY;
                        }
                        statusText.innerText = "Çizim Yapılıyor...";
                    } else {
                        isDrawing = false;
                        statusText.innerText = "Hareket Bekleniyor... (İşaret: Çiz, Çimdik: Tut, Avuç: Sil)";
                    }
                }

                ctx.beginPath();
                ctx.arc(indexX, indexY, 5, 0, 2 * Math.PI);
                ctx.fillStyle = isPinching ? 'white' : drawingColor;
                ctx.fill();
            } else {
                isDrawing = false;
                if (movableBox.isDragging) movableBox.isDragging = false;
            }
        }

        // MediaPipe Hands Ayarları
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.8,
            minTrackingConfidence: 0.7
        });

        hands.onResults(drawScene);

        // --- GÜVENLİ VE GARANTİ KAMERA BAŞLATMA SİSTEMİ ---
        async function startCamera() {
            try {
                // Tarayıcıdan video izni istiyoruz
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 }
                });
                
                video.srcObject = stream;
                
                // Kamera görüntüsü her yüklendiğinde el takibine gönderiyoruz
                video.addEventListener('loadedmetadata', () => {
                    statusText.innerText = "Sistem Hazır! Sihir Senin Ellerinde.";
                    
                    async function detectionLoop() {
                        if (!video.paused && !video.ended) {
                            await hands.send({ image: video });
                        }
                        requestAnimationFrame(detectionLoop);
                    }
                    detectionLoop();
                });

            } catch (error) {
                console.error("Kamera hatası:", error);
                statusText.style.color = "red";
                statusText.innerText = "Kamera İzni Alınamadı! Lütfen adres çubuğundaki kilit simgesinden izin verin.";
            }
        }

        // Sayfa yüklenince kamerayı aç
        window.addEventListener('DOMContentLoaded', startCamera);

    </script>
</body>
</html>
