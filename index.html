<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Mily Troll Obby</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Arial Black', sans-serif; touch-action: none; }
        canvas { display: block; }
        
        #controls { 
            position: absolute; bottom: 20px; width: 100%; 
            display: flex; justify-content: space-between; 
            padding: 0 20px; box-sizing: border-box; z-index: 100;
        }
        .btn-group { display: flex; gap: 15px; }
        .btn { 
            width: 75px; height: 75px; background: rgba(255,255,255,0.4); 
            border: 4px solid #fff; border-radius: 15px; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 35px; color: #333; user-select: none;
        }
        #jump-btn { 
            background: #ff4757; color: white; width: 100px; height: 100px; 
            border-radius: 50%; font-size: 20px;
        }
        #status { position: absolute; top: 10px; width: 100%; text-align: center; color: red; font-size: 20px; text-shadow: 2px 2px #000; pointer-events: none; }
    </style>
</head>
<body>

    <div id="status">DİKKAT: ÇİVİLERE DİKKAT ET!</div>
    <div id="controls">
        <div class="btn-group">
            <div class="btn" id="lBtn">←</div>
            <div class="btn" id="rBtn">→</div>
        </div>
        <div class="btn" id="jump-btn">ZIPLA</div>
    </div>

    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        let player = { x: 40, y: 100, w: 25, h: 35, vx: 0, vy: 0, grounded: false, deaths: 0 };
        let gravity = 0.6, jumpPower = -13, moveL = false, moveR = false;

        // TROLL PARKUR ELEMANLARI
        // type: 0 = Normal, 1 = Çivi (Öldürür), 2 = Tuzak (Basınca Yok Olur)
        let platforms = [
            { x: 0, y: canvas.height - 80, w: 150, type: 0 }, 
            { x: 180, y: canvas.height - 80, w: 40, type: 1 }, // Yer çivisi
            { x: 250, y: canvas.height - 160, w: 100, type: 0 },
            { x: 400, y: canvas.height - 160, w: 60, type: 2, alpha: 1 }, // Tuzak blok
            { x: 200, y: canvas.height - 260, w: 80, type: 0 },
            { x: 240, y: canvas.height - 280, w: 20, type: 1 }, // Platform üstü çivi
            { x: 50, y: canvas.height - 350, w: 100, type: 0 },
            { x: 250, y: canvas.height - 440, w: 120, type: 0 } // Final
        ];

        const setup = (id, s, e) => {
            const el = document.getElementById(id);
            el.ontouchstart = (i) => { i.preventDefault(); s(); };
            el.ontouchend = (i) => { i.preventDefault(); e(); };
        };
        setup('lBtn', () => moveL = true, () => moveL = false);
        setup('rBtn', () => moveR = true, () => moveR = false);
        setup('jump-btn', () => { if(player.grounded){ player.vy = jumpPower; player.grounded = false; } }, () => {});

        function die() {
            player.x = 40; player.y = 100; player.vy = 0; player.deaths++;
            document.getElementById('status').textContent = "ÖLÜM: " + player.deaths;
            // Tuzakları geri getir
            platforms.forEach(p => { if(p.type === 2) p.alpha = 1; });
        }

        function update() {
            player.vx = moveL ? -5 : (moveR ? 5 : 0);
            player.vy += gravity;
            player.x += player.vx;
            player.y += player.vy;

            player.grounded = false;
            for (let p of platforms) {
                // Çarpışma Kontrolü
                if (player.x + player.w > p.x && player.x < p.x + p.w &&
                    player.y + player.h > p.y && player.y + player.h < p.y + 20) {
                    
                    if (p.type === 1) { // ÇİVİYE BASTI
                        die();
                    } else if (p.type === 2 && p.alpha > 0) { // TUZAK BLOK
                        player.y = p.y - player.h; player.vy = 0; player.grounded = true;
                        p.alpha -= 0.05; // Yavaşça yok olur
                        if(p.alpha < 0.1) p.alpha = 0; 
                    } else if (p.type === 0) { // NORMAL BLOK
                        player.y = p.y - player.h; player.vy = 0; player.grounded = true;
                    }
                }
            }

            if (player.y > canvas.height || player.x < -30) die();
            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            platforms.forEach(p => {
                if (p.type === 0) { // Normal Platform
                    ctx.fillStyle = "#4CAF50";
                    ctx.fillRect(p.x, p.y, p.w, 20);
                } else if (p.type === 1) { // ÇİVİ
                    ctx.fillStyle = "red";
                    for(let i=0; i<p.w; i+=10) {
                        ctx.beginPath();
                        ctx.moveTo(p.x + i, p.y + 20);
                        ctx.lineTo(p.x + i + 5, p.y);
                        ctx.lineTo(p.x + i + 10, p.y + 20);
                        ctx.fill();
                    }
                } else if (p.type === 2) { // TUZAK
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = "#FFA500";
                    ctx.fillRect(p.x, p.y, p.w, 20);
                    ctx.globalAlpha = 1;
                }
            });

            // NOOB KARAKTER
            ctx.fillStyle = "#FFD500"; // Kafa
            ctx.fillRect(player.x + 4, player.y, 17, 12);
            ctx.fillStyle = "#0059B3"; // Gövde
            ctx.fillRect(player.x, player.y + 12, 25, 23);
        }
        update();
    </script>
</body>
</html>
