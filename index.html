<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Mily Drift Racer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; touch-action: none; font-family: 'Arial Black', sans-serif; }
        canvas { display: block; }
        #ui { 
            position: absolute; top: 10px; width: 100%; text-align: center; 
            color: #f1c40f; font-size: 26px; font-weight: bold; 
            text-shadow: 2px 2px #000; pointer-events: none; z-index: 10;
        }
        #controls {
            position: absolute; bottom: 30px; width: 100%; 
            display: flex; justify-content: space-around; z-index: 100;
        }
        .btn {
            width: 110px; height: 90px; background: rgba(0,0,0,0.6);
            border: 4px solid #f1c40f; border-radius: 20px;
            display: flex; justify-content: center; align-items: center;
            font-size: 50px; color: #f1c40f; user-select: none;
        }
    </style>
</head>
<body>

    <div id="ui">SKOR: <span id="score">0</span></div>
    
    <div id="controls">
        <div class="btn" id="lBtn">←</div>
        <div class="btn" id="rBtn">→</div>
    </div>

    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0;
        let speed = 6;
        let gameOver = false;
        let roadOffset = 0;

        // Senin Araban (Spor Araba)
        let player = { x: canvas.width/2 - 30, y: canvas.height - 180, w: 60, h: 100 };
        let traffic = [];
        let moveL = false, moveR = false;

        const bind = (id, s) => {
            const el = document.getElementById(id);
            el.ontouchstart = (e) => { e.preventDefault(); if(id==='lBtn') moveL = true; else moveR = true; };
            el.ontouchend = (e) => { e.preventDefault(); if(id==='lBtn') moveL = false; else moveR = false; };
        };
        bind('lBtn'); bind('rBtn');

        function addCar() {
            if (Math.random() > 0.96) {
                let xPos = Math.random() * (canvas.width - 80) + 10;
                traffic.push({ x: xPos, y: -120, w: 60, h: 100, color: `hsl(${Math.random()*360}, 60%, 50%)` });
            }
        }

        function update() {
            if (gameOver) return;

            roadOffset += speed;
            if (roadOffset > 60) roadOffset = 0;

            if (moveL && player.x > 10) player.x -= 8;
            if (moveR && player.x < canvas.width - 70) player.x += 8;

            addCar();
            traffic.forEach((car, i) => {
                car.y += speed;
                // Çarpışma
                if (player.x < car.x + car.w && player.x + player.w > car.x &&
                    player.y < car.y + car.h && player.y + player.h > car.y) {
                    gameOver = true;
                    alert("KAZA YAPILDI! SKORUN: " + score);
                    location.reload();
                }
                if (car.y > canvas.height) {
                    traffic.splice(i, 1);
                    score++;
                    scoreEl.textContent = score;
                    speed += 0.1; // Giderek hızlanır
                }
            });

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.fillStyle = "#333"; // Asfalt
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Yol Çizgileri
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 6;
            ctx.setLineDash([40, 20]);
            ctx.lineDashOffset = -roadOffset;
            ctx.beginPath();
            ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height);
            ctx.stroke();

            // Senin Araban
            ctx.fillStyle = "#e74c3c"; // Kırmızı Dodge
            ctx.fillRect(player.x, player.y, player.w, player.h); 
            ctx.fillStyle = "#000"; // Camlar
            ctx.fillRect(player.x+5, player.y+20, 50, 20);
            ctx.fillStyle = "yellow"; // Farlar
            ctx.fillRect(player.x+5, player.y, 10, 5); ctx.fillRect(player.x+45, player.y, 10, 5);

            // Trafikteki Arabalar
            traffic.forEach(car => {
                ctx.fillStyle = car.color;
                ctx.fillRect(car.x, car.y, car.w, car.h);
                ctx.fillStyle = "black";
                ctx.fillRect(car.x+5, car.y+60, 50, 20);
            });
        }
        update();
    </script>
</body>
</html>
