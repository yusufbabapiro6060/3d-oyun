<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihirli El Çizimi</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0; padding: 0;
            background-color: #0a0a0a; /* Çok koyu gri/siyah arka plan */
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; color: #00ff00;
        }

        #container {
            position: relative;
            width: 1280px; /* HD genişlik */
            height: 720px;  /* HD yükseklik */
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: black; /* Kamera görüntüsü yerine siyah ekran */
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
        }

        /* Kamera gizli (display: none) ama kütüphane için çalışmaya devam ediyor */
        #webcam {
            display: none;
        }

        /* Çizim Tuvali - Her şey burada görünür */
        #canvas {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            z-index: 10;
        }

        #status {
            margin-top: 15px; font-size: 16px;
            text-shadow: 0 0 5px #00ff00;
        }
    </style>
</head>
<body>

    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas" width="1280" height="720"></canvas>
    </div>

    <div id="status">Sistem Başlatılıyor... Lütfen Kameraya İzin Verin.</div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');

        // Çizim kalemi ayarları
        let drawingColor = '#ff0055'; 
        let drawingLineWidth = 6;
        let isDrawing = false;
        let lastX = 0; let lastY = 0;

        // Hareket ettirilebilir Mavi Kutu
        let movableBox = {
            x: 590, y: 310, width: 100, height: 100,
            color: '#00e5ff', isDragging: false,
            dragStartX: 0, dragStartY: 0
        };

        // Mesafeyi hesaplamak için yardımcı fonksiyon
        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        // Ana Çizim Fonksiyonu
        function drawScene(results) {
            // 1. Ekranı temizle ama çizimleri tutmak için 'Kamera Arka Planı' yerine Siyah bir kare çiz
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Mavi Kutuyu Çiz
            ctx.fillStyle = movableBox.color;
            ctx.fillRect(movableBox.x, movableBox.y, movableBox.width, movableBox.height);
            
            // Eğer tutuluyorsa parlama efekti ver
            if (movableBox.isDragging) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = movableBox.color;
                ctx.strokeStyle = 'white';
                ctx.strokeRect(movableBox.x, movableBox.y, movableBox.width, movableBox.height);
                ctx.shadowBlur = 0; // Efekti sıfırla
            }

            // 3. Mevcut Çizimleri Koru
            // (Bu sürümde çizimler bir 'path' olarak saklanmıyor, direkt canvas'a işleniyor.
            // Arka planı siyah yaptığımız için `clearRect` kullanmıyoruz, böylece çizimler silinmiyor.)

            // El verisi varsa işlem yap
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Önemli noktalar: 0:Bilek, 4:Baş Parmak Ucu, 8:İşaret Parmak Ucu, 12:Orta Parmak Ucu, 20:Serçe Parmak Ucu
                const wrist = landmarks[0];
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const middleTip = landmarks[12];
                const pinkyTip = landmarks[20];

                // Aynalama işlemini el noktalarına uygula
                const thumbX = (1 - thumbTip.x) * canvas.width;
                const thumbY = thumbTip.y * canvas.height;
                const indexX = (1 - indexTip.x) * canvas.width;
                const indexY = indexTip.y * canvas.height;

                // --- HAREKET ALGILAMA MANTIĞI ---

                // 1. ÇİMDİK / TUTMA HAREKETİ (Baş ve İşaret parmağı birbirine çok yakınsa)
                // Mesafe normalize edilmiş (0-1 arası) veriden hesaplanır, 0.05 gibi bir eşik iyidir.
                const pinchDistance = getDistance(thumbTip, indexTip);
                const isPinching = pinchDistance < 0.05;

                // 2. TAM AÇIK AVUÇ (Silme Hareketi)
                // İşaret, Orta ve Serçe parmak uçları bilekten uzaksa avuç açıktır.
                const isPalmOpen = getDistance(wrist, indexTip) > 0.4 && 
                                    getDistance(wrist, middleTip) > 0.4 &&
                                    getDistance(wrist, pinkyTip) > 0.4;

                // --- AKSİYONLAR ---

                // A) SİLME (Açık Avuç)
                if (isPalmOpen && !movableBox.isDragging) {
                    // Siyah arka planı tekrar çizerek ekranı temizle
                    ctx.fillStyle = "black";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
