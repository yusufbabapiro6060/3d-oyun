<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihirli El Çizimi</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0; padding: 0;
            background-color: #0a0a0a;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; color: #00ff00;
        }

        #container {
            position: relative;
            width: 1280px; 
            height: 720px;  
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: black; 
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
        }

        #webcam {
            display: none;
        }

        #canvas {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            z-index: 10;
        }

        #status {
            margin-top: 15px; font-size: 16px;
            text-shadow: 0 0 5px #00ff00;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas" width="1280" height="720"></canvas>
    </div>

    <div id="status">Sistem Başlatılıyor... Lütfen Bekleyin.</div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');

        // Çizimleri hafızada saklamak için gizli bir tuval (Canvas) oluşturuyoruz
        const drawingCanvas = document.createElement('canvas');
        drawingCanvas.width = 1280;
        drawingCanvas.height = 720;
        const dCtx = drawingCanvas.getContext('2d');

        // Çizim kalemi ayarları
        let drawingColor = '#ff0055'; 
        let drawingLineWidth = 8;
        let isDrawing = false;
        let lastX = 0; let lastY = 0;

        // Mavi Kutu Ayarları
        let movableBox = {
            x: 590, y: 310, width: 140, height: 140,
            color: '#00e5ff', isDragging: false,
            dragStartX: 0, dragStartY: 0
        };

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function drawScene(results) {
            // 1. Ana ekranı tamamen siyah yap (Temizle)
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Hafızada saklanan tüm çizimleri ekrana yansıt
            ctx.drawImage(drawingCanvas, 0, 0);

            // 3. Mavi Kutuyu Çiz
            ctx.fillStyle = movableBox.color;
            ctx.fillRect(movableBox.x, movableBox.y, movableBox.width, movableBox.height);
            
            if (movableBox.isDragging) {
                ctx.shadowBlur = 25;
                ctx.shadowColor = movableBox.color;
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 4;
                ctx.strokeRect(movableBox.x, movableBox.y, movableBox.width, movableBox.height);
                ctx.shadowBlur = 0;
            }

            // El algılandıysa pozisyonları kontrol et
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                const wrist = landmarks[0];
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const middleTip = landmarks[12];
                const pinkyTip = landmarks[20];

                // Aynalanmış koordinatlar
                const thumbX = (1 - thumbTip.x) * canvas.width;
                const thumbY = thumbTip.y * canvas.height;
                const indexX = (1 - indexTip.x) * canvas.width;
                const indexY = indexTip.y * canvas.height;

                // Parmaklar arası mesafeler
                const pinchDistance = getDistance(thumbTip, indexTip);
                const isPinching = pinchDistance < 0.06; // Çimdik hassasiyeti

                // El tamamen açık mı kontrolü (Silme hareketi için)
                const isPalmOpen = getDistance(wrist, indexTip) > 0.35 && 
                                    getDistance(wrist, middleTip) > 0.35 &&
                                    getDistance(wrist, pinkyTip) > 0.35;

                // --- HAREKETLER ---

                // A) EKRANI TEMİZLE (Avuç içi açık)
                if (isPalmOpen && !movableBox.isDragging) {
                    dCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
                    statusText.innerText = "Ekran Temizlendi!";
                    isDrawing = false;
                    return;
                }

                // B) TUTMA VE HAREKET ETTİRME (Çimdik Hareketi)
                if (isPinching) {
                    if (!movableBox.isDragging) {
                        // Eğer parmak uçları mavi kutunun içindeyse tut
                        if (indexX > movableBox.x && indexX < movableBox.x + movableBox.width &&
                            indexY > movableBox.y && indexY < movableBox.y + movableBox.height) {
                            
                            movableBox.isDragging = true;
                            movableBox.dragStartX = indexX - movableBox.x;
                            movableBox.dragStartY = indexY - movableBox.y;
                            statusText.innerText = "Mavi Kutu Tutuldu!";
                        }
                    } else {
                        // Kutuyu hareket ettir
                        movableBox.x = indexX - movableBox.dragStartX;
                        movableBox.y = indexY - movableBox.dragStartY;
                    }
                    isDrawing = false; 

                } else {
                    // Parmakları açtıysa kutuyu bırak
                    if (movableBox.isDragging) {
                        movableBox.isDragging = false;
                        statusText.innerText = "Kutu Bırakıldı.";
                    }

                    // C) ÖZGÜRCE ÇİZİM MODU (Sadece işaret parmağı havadaysa)
                    // İşaret parmağı açık ve bükülmemişse (id 8, id 6'dan yukarıdaysa)
                    if (indexTip.y < landmarks[6].y) {
                        if (!isDrawing) {
                            isDrawing = true;
                            lastX = indexX; lastY = indexY;
                        } else {
                            // Çizgiyi hafızadaki tuvale (drawingCanvas) çiziyoruz ki silinmesin
                            dCtx.beginPath();
                            dCtx.strokeStyle = drawingColor;
                            dCtx.lineWidth = drawingLineWidth;
                            dCtx.lineCap = 'round';
                            dCtx.moveTo(lastX, lastY);
                            dCtx.lineTo(indexX, indexY);
                            dCtx.stroke();
                            
                            lastX = indexX; lastY = indexY;
                        }
                        statusText.innerText = "Çizim Yapılıyor... ✍️";
                    } else {
                        isDrawing = false;
                        statusText.innerText = "Hareket Bekleniyor... (İşaret: Çiz, Çimdik: Kutuyu Tut, Avuç: Sil)";
                    }
                }

                // Parmağın ucundaki parlak küçük imleç
                ctx.beginPath();
                ctx.arc(indexX, indexY, 6, 0, 2 * Math.PI);
                ctx.fillStyle = isPinching ? 'white' : drawingColor;
                ctx.fill();
            } else {
                isDrawing = false;
                if (movableBox.isDragging) movableBox.isDragging = false;
            }
        }

        // MediaPipe Ayarları
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.75,
            minTrackingConfidence: 0.75
        });

        hands.onResults(drawScene);

        // Kamera Başlatma Fonksiyonu
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 }
                });
                
                video.srcObject = stream;
                
                video.addEventListener('loadedmetadata', () => {
                    statusText.innerText = "Kamera Aktif! Elinizi Gösterin.";
                    
                    async function detectionLoop() {
                        if (!video.paused && !video.ended) {
                            await hands.send({ image: video });
                        }
                        requestAnimationFrame(detectionLoop);
                    }
                    detectionLoop();
                });

            } catch (error) {
                console.error("Kamera hatası:", error);
                statusText.style.color = "red";
                statusText.innerText = "Kamera İzni Eksik! Lütfen tarayıcı ayarlarından kamerayı açın.";
            }
        }

        window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
