<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera ile Çizim ve Hareket Ettirme</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        #container {
            position: relative;
            width: 800px;
            height: 600px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Kamerayı ters çeviriyoruz (Ayna görüntüsü için) */
        #webcam {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotateY(180deg);
            object-fit: cover;
        }

        /* Çizim yapacağımız şeffaf tuval */
        #canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 10;
        }

        /* Üstteki Kontrol Paneli */
        #controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        button {
            background: #333;
            color: white;
            border: 2px solid #555;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        button.active {
            background: #00ff66;
            color: black;
            border-color: #00ff66;
            box-shadow: 0 0 10px #00ff66;
        }

        #clear-btn {
            background: #ff3333;
            border-color: #ff3333;
        }
        #clear-btn:hover {
            background: #cc0000;
        }

        #status {
            margin-top: 15px;
            font-size: 18px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="controls">
        <button id="draw-mode" class="active">Çizim Modu</button>
        <button id="move-mode">Hareket Modu</button>
        <button id="clear-btn">Ekranı Temizle</button>
    </div>

    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas" width="800" height="600"></canvas>
    </div>

    <div id="status">Sistem Yükleniyor... Lütfen Kameraya İzin Verin.</div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');

        let currentMode = 'draw'; // 'draw' veya 'move'
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // Hareket ettirilebilir bir obje (Örn: ekranda gezdireceğimiz bir kare)
        let movableBox = {
            x: 350,
            y: 250,
            width: 100,
            height: 100,
            color: '#00e5ff',
            isDragging: false
        };

        // Butonların Dinleyicileri
        document.getElementById('draw-mode').addEventListener('click', (e) => {
            currentMode = 'draw';
            setActiveButton(e.target);
        });
        document.getElementById('move-mode').addEventListener('click', (e) => {
            currentMode = 'move';
            setActiveButton(e.target);
        });
        document.getElementById('clear-btn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBox(); // Kareyi geri çiz
        });

        function setActiveButton(activeBtn) {
            document.getElementById('draw-mode').classList.remove('active');
            document.getElementById('move-mode').classList.remove('active');
            activeBtn.add('active');
        }

        // Hareketli kutuyu ekrana çizme fonksiyonu
        function drawBox() {
            ctx.fillStyle = movableBox.color;
            ctx.fillRect(movableBox.x, movableBox.y, movableBox.width, movableBox.height);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.strokeRect(movableBox.x, movableBox.y, movableBox.width, movableBox.height);
        }

        // İlk başta kutuyu çizelim
        drawBox();

        // MediaPipe Hands Ayarları
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        // Kamera Başlatma
        const camera = new Camera(video, {
            onFrame: async () => {
                await hands.send({ image: video });
            },
            width: 800,
            height: 600
        });
        camera.start().then(() => {
            statusText.innerText = "Sistem Hazır! İşaret parmağını kullan.";
        });

        // Kameradan el verisi geldikçe burası çalışır
        function onResults(results) {
            // Her karede ekranı tamamen sıfırlarsak çizimler silinir. 
            // Bu yüzden sadece hareketli objeyi güncellerken dikkat ediyoruz.
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // İşaret parmağının ucu (8 numaralı nokta)
                // Kamera ters çevrildiği (aynalandığı) için x koordinatını ters çeviriyoruz (1 - x)
                const fingerX = (1 - landmarks[8].x) * canvas.width;
                const fingerY = landmarks[8].y * canvas.height;

                // Parmağın ucuna küçük bir imleç çizelim (Nerede olduğumuzu görelim)
                // İmlecin sürekli yenilenmesi için ekranı temizleyip çizimleri koruyan bir mantık gerekir,
                // Basitlik adına direkt mod işlemlerine geçiyoruz:

                if (currentMode === 'draw') {
                    // ÇİZİM MODU
                    if (!isDrawing) {
                        isDrawing = true;
                        lastX = fingerX;
                        lastY = fingerY;
                    } else {
                        ctx.beginPath();
                        ctx.strokeStyle = '#ff3366'; // Çizim rengi pembe/kırmızı
                        ctx.lineWidth = 8;
                        ctx.lineCap = 'round';
                        ctx.moveTo(lastX, lastY);
                        ctx.lineTo(fingerX, fingerY);
                        ctx.stroke();
                        
                        lastX = fingerX;
                        lastY = fingerY;
                    }
                } else if (currentMode === 'move') {
                    // HAREKET MODU
                    isDrawing = false;

                    // Parmağımız mavi kutunun içinde mi kontrol et
                    if (fingerX > movableBox.x && fingerX < movableBox.x + movableBox.width &&
                        fingerY > movableBox.y && fingerY < movableBox.y + movableBox.height) {
                        
                        // Kutunun konumunu parmağın ucuna göre güncelle (Merkezle)
                        // Önceki yerini temizlemek için:
                        ctx.clearRect(0, 0, canvas.width, canvas.height); 
                        
                        movableBox.x = fingerX - movableBox.width / 2;
                        movableBox.y = fingerY - movableBox.height / 2;
                        
                        drawBox();
                    }
                }
            } else {
                // El kamerada yoksa çizimi durdur
                isDrawing = false;
            }
        }
    </script>
</body>
</html>
